# nginx configuration for the OPD Scan QC frontend container.
#
# Replaces /etc/nginx/nginx.conf wholesale. Two jobs:
#   1. serve the built SPA;
#   2. proxy /api to the backend, so the browser talks to one origin.
#
# Everything nginx writes lives under /tmp, so the process runs as the
# unprivileged "nginx" user on port 8080.

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/nginx-cache/client;
    proxy_temp_path       /tmp/nginx-cache/proxy;
    fastcgi_temp_path     /tmp/nginx-cache/fastcgi;
    uwsgi_temp_path       /tmp/nginx-cache/uwsgi;
    scgi_temp_path        /tmp/nginx-cache/scgi;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # Access log carries request paths. Page and document IDs are opaque UUIDs,
    # never patient names, so this is safe to keep — but see docs/DEPLOYMENT.md
    # on log retention before shipping it anywhere.
    log_format  main  '$remote_addr - $status $request_method $uri '
                      '$body_bytes_sent $request_time';
    access_log  /dev/stdout main;
    error_log   /dev/stderr warn;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript
                      application/json image/svg+xml application/wasm;

    upstream backend {
        # "backend" is the compose service name.
        server backend:8000;
        keepalive 16;
    }

    server {
        listen      8080;
        server_name _;
        root        /usr/share/nginx/html;
        index       index.html;

        # ------------------------------------------------------------------ #
        # Security headers
        #
        # Applied with `always` so they survive error responses too.
        # HSTS is deliberately NOT set here: this container is normally behind
        # a TLS-terminating reverse proxy, and that proxy is the right place to
        # own HSTS. Setting it in two places makes it impossible to turn off.
        # ------------------------------------------------------------------ #
        add_header X-Content-Type-Options   "nosniff"            always;
        add_header X-Frame-Options          "DENY"               always;
        add_header Referrer-Policy          "no-referrer"        always;
        add_header Cross-Origin-Opener-Policy "same-origin"      always;
        add_header Permissions-Policy
                   "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

        # The SPA loads no third-party script, style, font or image. Scan
        # previews come from same-origin /api routes as authenticated fetches
        # turned into blob: URLs, which is why blob: appears under img-src.
        # 'unsafe-inline' for styles is required by the Tailwind runtime style
        # injection in the built bundle.
        # Kept on one line on purpose: nginx treats a backslash inside a quoted
        # string as an escape, so a "line continuation" here would embed a
        # newline in the header value.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # Container-local liveness probe. Not proxied, no logging.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # ------------------------------------------------------------------ #
        # API proxy
        #
        # Covers the JSON routes and the image routes alike. Both are
        # role-checked server side; nginx adds no authorisation of its own and
        # must not be relied on for any.
        # ------------------------------------------------------------------ #
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            # Uploads are whole scanned case files: streamed straight through,
            # with no nginx-side size cap beyond the backend's own MAX_UPLOAD_MB.
            client_max_body_size 0;
            proxy_request_buffering off;

            # A page of a 25 MB photographed spread can take a while through the quality engine and
            # a provider round trip. The standalone prescription analyzer (POST /prescriptions/analyze)
            # is the extreme case: it runs OCR and an LLM call synchronously, in the same request, for
            # every page of the upload — a multi-page file can legitimately take several minutes.
            proxy_connect_timeout 10s;
            proxy_send_timeout    600s;
            proxy_read_timeout    600s;

            # Responses on these routes are patient data. Never cached by the
            # browser or by anything in between.
            proxy_hide_header  Cache-Control;
            add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
            add_header Pragma        "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ------------------------------------------------------------------ #
        # Static assets
        #
        # Vite emits content-hashed filenames under /assets, so those are
        # immutable and cached hard.
        # ------------------------------------------------------------------ #
        #
        # nginx does not merge add_header across levels: a location carrying any
        # add_header of its own drops every one inherited from the server block.
        # That is why nosniff is repeated in each location below that sets a
        # header. `location /` sets none, so it inherits the full set.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # index.html is NEVER cached. It is the only file whose name does not
        # change between releases, so a cached copy would keep clients pinned to
        # the previous bundle after a deploy.
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Pragma        "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
        }

        # Client-side routing: unknown paths fall back to the SPA shell, which
        # inherits the no-cache rule above via the internal redirect.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
